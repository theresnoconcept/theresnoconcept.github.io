<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сэма | Научные статьи по психологии</title>
<meta name="description" content="Научные публикации по психологии">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7f5;
    --card: #ffffff;
    --text: #2b2b33;
    --muted: #7a7a85;
    --accent: #b08bbb;
    --accent-soft: #efe5f3;
    --line: #ebe4e0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 20px; }

  header { padding: 90px 0 50px; text-align: center; }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 6vw, 3.6rem);
    margin-bottom: 14px;
  }
  header .role {
    color: var(--accent);
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    font-size: .85rem;
  }
  header p.lead {
    max-width: 560px;
    margin: 20px auto 0;
    color: var(--muted);
    font-size: 1.05rem;
  }

  h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    margin-bottom: 20px;
  }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
  .filters button {
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    padding: 7px 16px;
    border-radius: 999px;
    cursor: pointer;
    font: inherit;
    font-size: .9rem;
    transition: .2s;
  }
  .filters button:hover { border-color: var(--accent); }
  .filters button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 26px 28px;
    margin-bottom: 18px;
    transition: transform .2s, box-shadow .2s;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(120, 90, 130, .1); }
  .card .meta { color: var(--muted); font-size: .85rem; margin-bottom: 8px; }
  .card h3 { font-family: 'Playfair Display', serif; font-size: 1.3rem; margin-bottom: 10px; }
  .card p { color: #55555f; margin-bottom: 16px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .tag { background: var(--accent-soft); color: #7c5a89; font-size: .78rem; padding: 3px 11px; border-radius: 999px; }
  .links a {
    color: var(--accent);
    font-weight: 500;
    text-decoration: none;
    margin-right: 18px;
    font-size: .92rem;
  }
  .links a:hover { text-decoration: underline; }

  footer { text-align: center; padding: 60px 0 50px; color: var(--muted); font-size: .9rem; }
  footer a { color: var(--accent); text-decoration: none; margin: 0 8px; }
</style>
</head>
<body>

<header class="wrap">
  <div class="role">Psy student · Научные исследования</div>
  <h1>Сэма</h1>
  <p class="lead">Студентка-психолог. Здесь собраны мои научные статьи и исследовательские работы.</p>
</header>

<main class="wrap">
  <h2>Публикации</h2>
  <div class="filters" id="filters"></div>
  <div id="articles"></div>
</main>

<footer class="wrap">
  <p>Связаться со мной:
    <a href="mailto:23eun.s@gmail.com">Email</a>
    <a href="https://t.me/armoredheart" target="_blank" rel="noopener">Telegram</a>
  </p>
  <p style="margin-top:10px">© <span id="year"></span> Сэма</p>
</footer>

<script>
  // === ДОБАВЛЯЙ СТАТЬИ ЗДЕСЬ: копируй блок { ... }, меняй текст ===
  // Пример блока статьи (скопируй внутрь [ ] и заполни):
  // {
  //   title: "Название статьи",
  //   year: 2026,
  //   journal: "Журнал / конференция",
  //   abstract: "Краткая аннотация в 2-3 предложения.",
  //   tags: ["тег1", "тег2"],
  //   links: [{ label: "Читать (DOI)", url: "https://doi.org/..." }]
  // }
  const articles = [];
  // ================================================================

  const list = document.getElementById('articles');
  const filters = document.getElementById('filters');
  document.getElementById('year').textContent = new Date().getFullYear();

  const allTags = ['Все', ...new Set(articles.flatMap(a => a.tags))];
  let current = 'Все';

  function render() {
    list.innerHTML = '';
    if (!articles.length) {
      list.innerHTML = '<div class="card"><h3>Скоро здесь появятся статьи</h3><p>Публикации и исследовательские работы добавляются, загляните позже.</p></div>';
      return;
    }
    articles
      .filter(a => current === 'Все' || a.tags.includes(current))
      .sort((a, b) => b.year - a.year)
      .forEach(a => {
        const el = document.createElement('article');
        el.className = 'card';
        el.innerHTML = `
          <div class="meta">${a.year} · ${a.journal}</div>
          <h3>${a.title}</h3>
          <p>${a.abstract}</p>
          <div class="tags">${a.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
          <div class="links">${a.links.map(l => `<a href="${l.url}" target="_blank" rel="noopener">${l.label} →</a>`).join('')}</div>`;
        list.appendChild(el);
      });
  }

  function renderFilters() {
    filters.innerHTML = '';
    if (!articles.length) return;
    allTags.forEach(t => {
      const b = document.createElement('button');
      b.textContent = t;
      if (t === current) b.classList.add('active');
      b.onclick = () => { current = t; renderFilters(); render(); };
      filters.appendChild(b);
    });
  }

  renderFilters();
  render();
</script>
</body>
</html>
