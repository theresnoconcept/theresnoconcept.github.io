<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сэма | Научные статьи по психологии</title>
<meta name="description" content="Научные публикации по психологии">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7f5;
    --card: #ffffff;
    --text: #2b2b33;
    --muted: #7a7a85;
    --accent: #b08bbb;
    --accent-soft: #efe5f3;
    --line: #ebe4e0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 20px; }

  .lang {
    position: absolute;
    top: 20px;
    right: 20px;
    display: flex;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 999px;
    overflow: hidden;
  }
  .lang button {
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 6px 14px;
    font: inherit;
    font-size: .82rem;
    font-weight: 500;
    cursor: pointer;
    transition: .2s;
  }
  .lang button:hover { color: var(--accent); }
  .lang button.active { background: var(--accent); color: #fff; }

  header { padding: 90px 0 50px; text-align: center; }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 6vw, 3.6rem);
    margin-bottom: 14px;
  }
  header .role {
    color: var(--accent);
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    font-size: .85rem;
  }
  header p.lead {
    max-width: 560px;
    margin: 20px auto 0;
    color: var(--muted);
    font-size: 1.05rem;
  }

  h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    margin-bottom: 20px;
  }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
  .filters button {
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    padding: 7px 16px;
    border-radius: 999px;
    cursor: pointer;
    font: inherit;
    font-size: .9rem;
    transition: .2s;
  }
  .filters button:hover { border-color: var(--accent); }
  .filters button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 26px 28px;
    margin-bottom: 18px;
    transition: transform .2s, box-shadow .2s;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(120, 90, 130, .1); }
  .card .meta { color: var(--muted); font-size: .85rem; margin-bottom: 8px; }
  .card h3 { font-family: 'Playfair Display', serif; font-size: 1.3rem; margin-bottom: 10px; }
  .card p { color: #55555f; margin-bottom: 16px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .tag { background: var(--accent-soft); color: #7c5a89; font-size: .78rem; padding: 3px 11px; border-radius: 999px; }
  .links a {
    color: var(--accent);
    font-weight: 500;
    text-decoration: none;
    margin-right: 18px;
    font-size: .92rem;
  }
  .links a:hover { text-decoration: underline; }

  footer { text-align: center; padding: 60px 0 50px; color: var(--muted); font-size: .9rem; }
  footer a { color: var(--accent); text-decoration: none; margin: 0 8px; }
</style>
</head>
<body>

<div class="lang" id="lang">
  <button type="button" data-lang="ru">RU</button>
  <button type="button" data-lang="en">EN</button>
</div>

<header class="wrap">
  <div class="role" data-i18n="role"></div>
  <h1 data-i18n="name"></h1>
  <p class="lead" data-i18n="lead"></p>
</header>

<main class="wrap">
  <h2 data-i18n="publications"></h2>
  <div class="filters" id="filters"></div>
  <div id="articles"></div>
</main>

<footer class="wrap">
  <p><span data-i18n="contact"></span>
    <a href="mailto:23eun.s@gmail.com">Email</a>
    <a href="https://t.me/armoredheart" target="_blank" rel="noopener">Telegram</a>
  </p>
  <p style="margin-top:10px">© <span id="year"></span> <span data-i18n="name"></span></p>
</footer>

<script>
  // ===== ТЕКСТЫ САЙТА: ru / en =====
  const I18N = {
    ru: {
      title: "Сэма | Научные статьи по психологии",
      description: "Научные публикации по психологии",
      role: "Psy student · Научные исследования",
      name: "Сэма",
      lead: "Студентка-психолог. Здесь собраны мои научные статьи и исследовательские работы.",
      publications: "Публикации",
      contact: "Связаться со мной:",
      all: "Все",
      emptyTitle: "Скоро здесь появятся статьи",
      emptyText: "Публикации и исследовательские работы добавляются, загляните позже."
    },
    en: {
      title: "Sema | Scientific articles in psychology",
      description: "Scientific publications in psychology",
      role: "Psy student · Scientific research",
      name: "Sema",
      lead: "Psychology student. This is where my scientific articles and research work are collected.",
      publications: "Publications",
      contact: "Get in touch:",
      all: "All",
      emptyTitle: "Articles are coming soon",
      emptyText: "Publications and research papers are being added, please check back later."
    }
  };

  // ===== ДОБАВЛЯЙ СТАТЬИ ЗДЕСЬ =====
  // Любое текстовое поле можно писать двумя способами:
  //   просто строкой (одинаково на обоих языках): "Текст"
  //   или для двух языков: { ru: "Текст", en: "Text" }
  // Пример блока статьи (скопируй внутрь [ ] и заполни):
  // {
  //   title: { ru: "Название статьи", en: "Article title" },
  //   year: 2026,
  //   journal: { ru: "Журнал / конференция", en: "Journal / conference" },
  //   abstract: { ru: "Краткая аннотация.", en: "Short abstract." },
  //   tags: [{ ru: "тревожность", en: "anxiety" }],
  //   links: [{ label: { ru: "Читать", en: "Read" }, url: "https://doi.org/..." }]
  // }
  const articles = [];
  // =================================

  let lang = 'ru';
  try {
    const saved = localStorage.getItem('lang');
    if (saved === 'ru' || saved === 'en') lang = saved;
    else if (!(navigator.language || 'ru').toLowerCase().startsWith('ru')) lang = 'en';
  } catch (e) {}

  const tr = v => (v && typeof v === 'object') ? (v[lang] || v.ru || v.en || '') : v;
  const T = key => I18N[lang][key];

  const list = document.getElementById('articles');
  const filters = document.getElementById('filters');
  document.getElementById('year').textContent = new Date().getFullYear();

  let current = null; // null = «Все / All»

  function applyStatic() {
    document.documentElement.lang = lang;
    document.title = T('title');
    document.querySelector('meta[name="description"]').setAttribute('content', T('description'));
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T(el.dataset.i18n); });
    document.querySelectorAll('#lang button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  }

  function render() {
    list.innerHTML = '';
    if (!articles.length) {
      list.innerHTML = `<div class="card"><h3>${T('emptyTitle')}</h3><p>${T('emptyText')}</p></div>`;
      return;
    }
    articles
      .filter(a => current === null || a.tags.some(t => tr(t) === current))
      .sort((a, b) => b.year - a.year)
      .forEach(a => {
        const el = document.createElement('article');
        el.className = 'card';
        el.innerHTML = `
          <div class="meta">${a.year} · ${tr(a.journal)}</div>
          <h3>${tr(a.title)}</h3>
          <p>${tr(a.abstract)}</p>
          <div class="tags">${a.tags.map(t => `<span class="tag">${tr(t)}</span>`).join('')}</div>
          <div class="links">${a.links.map(l => `<a href="${l.url}" target="_blank" rel="noopener">${tr(l.label)} →</a>`).join('')}</div>`;
        list.appendChild(el);
      });
  }

  function renderFilters() {
    filters.innerHTML = '';
    if (!articles.length) return;
    const tags = [...new Set(articles.flatMap(a => a.tags.map(tr)))];
    [null, ...tags].forEach(t => {
      const b = document.createElement('button');
      b.textContent = t === null ? T('all') : t;
      if (t === current) b.classList.add('active');
      b.onclick = () => { current = t; renderFilters(); render(); };
      filters.appendChild(b);
    });
  }

  function setLang(l) {
    lang = l;
    current = null;
    try { localStorage.setItem('lang', l); } catch (e) {}
    applyStatic();
    renderFilters();
    render();
  }

  document.querySelectorAll('#lang button').forEach(b => {
    b.addEventListener('click', () => setLang(b.dataset.lang));
  });

  applyStatic();
  renderFilters();
  render();
</script>
</body>
</html>
